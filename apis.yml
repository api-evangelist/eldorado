aid: eldorado
name: Eldorado
description: >-
  El Dorado is a stablecoin-powered payments SuperApp for Latin America whose public API
  provides crypto onramp/offramp (buy and sell) infrastructure across Argentina, Brazil,
  Colombia, Peru, Bolivia, Panama, Paraguay, the Dominican Republic and more. The API lets
  partners create buy and sell quotes and orders that convert between local fiat currencies
  (USD, ARS, BRL, COP, PEN and others) and crypto (settled in USDT on Arbitrum), with built-in
  KYC verification, 80+ local payment methods, and an embeddable Exchange Widget for no-code or
  low-code integration. Authentication uses per-partner ClientID and ReferralID headers plus a
  JWT bearer token obtained via an OTP login flow. El Dorado is backed by Multicoin Capital,
  Coinbase Ventures and Berkeley SkyDeck and has surpassed 500,000 users.
